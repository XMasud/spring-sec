server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    # This IS the registry, so it shouldn't register with itself or fetch its own registry
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false   # fine for dev; consider true in prod (avoids evicting instances during network blips)

management:
  endpoints:
    web:
      exposure:
        include: health,info