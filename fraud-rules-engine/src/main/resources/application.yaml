spring:
  application:
    name: fraud-rules-engine

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: fraud-rules-engine
      state-dir: ${KAFKA_STREAMS_STATE_DIR:/tmp/kafka-streams/fraud-rules-engine}

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.apache.kafka.streams: INFO
    com.mycompany.fraudengine: DEBUG