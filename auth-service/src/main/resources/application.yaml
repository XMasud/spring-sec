spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

    flyway:
      enabled: true
      baseline-on-migrate: true
      validate-on-migrate: true
      clean-disabled: true
      locations: classpath:db/migration

    jpa:
      hibernate:
        ddl-auto: validate