spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/sc-auth-service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate